domain_name: "PCB AOI"

# Domain-specific editable text fields for the detail row.
# Universal fields (Page Count, Relevance, User Comments) are hardcoded in the UI.
editable_fields:
  - label: "Research Area"
    json_path: "research_area"
  - label: "Model Name"
    json_path: "technique.model"
    stats_list: true     # <--- Maps to Slot 1 - there are two slots.
  - label: "Other Defects"
    json_path: "features.other"
    stats_list: true     # <--- Maps to Slot 2

groups:
  # --- Single-field Tri-State Filters ---
    # Friendly name is the group name (keep unused for single-field groups)
    # label is the column name.
  - name: "survey"
    friendly_name: ""
    filter_type: tri_state
    json_path: "is_survey"
    label: "Survey"
    header_class: "inferred-header"

  - name: "tht"
    friendly_name: ""
    filter_type: tri_state
    json_path: "is_through_hole"
    label: "THT" 
    header_class: "inferred-header"

  - name: "smt"
    friendly_name: ""
    filter_type: tri_state
    json_path: "is_smt"
    label: "SMT" 
    header_class: "inferred-header"

  - name: "xray"
    friendly_name: ""
    filter_type: tri_state
    json_path: "is_x_ray"
    label: "X-Ray"
    header_class: "inferred-header"

  # --- Multi-field Inclusion Groups (Features) ---
  - name: "pcb"
    friendly_name: "PCB"
    filter_type: inclusion
    json_path: "features"
    header_class: "inferred-header-2"
    fields:
      - key: "tracks"
        label: "Tracks"
        highlight: true
      - key: "holes"
        label: "Holes / Vias"
        highlight: true
      - key: "bare_pcb_other"
        label: "(Bare) PCB Other"
        highlight: true

  - name: "solder"
    friendly_name: "Solder"
    filter_type: inclusion
    json_path: "features"
    header_class: "inferred-header-2"
    fields:
      - key: "solder_insufficient"
        label: "Insufficient"
      - key: "solder_excess"
        label: "Excessive"
      - key: "solder_void"
        label: "Void / Hole"
      - key: "solder_crack"
        label: "Crack / Cold"
      - key: "solder_other"
        label: "Solder (Other)"

  - name: "pcba"
    friendly_name: "PCBA"
    filter_type: inclusion
    json_path: "features"
    header_class: "inferred-header-2"
    fields:
      - key: "missing_component"
        label: "Missing Comp"
        highlight: true
      - key: "wrong_component"
        label: "Wrong Comp"
        highlight: true
      - key: "orientation"
        label: "Orientation"
        highlight: true
      - key: "component_other"
        label: "Comp (Other)"
        highlight: true
      - key: "cosmetic"
        label: "Cosmetic"
        highlight: true

  - name: "other_features"
    friendly_name: ""
    filter_type: inclusion
    json_path: "features"
    header_class: "inferred-header-2"
    fields:
      - key: "other"
        label: "Other"
        render_type: text_presence
        highlight: true

  # --- Visual-Only Group (Techniques) ---
  - name: "techniques"
    friendly_name: "Techniques"
    filter_type: none
    json_path: "technique"
    header_class: "inferred-header-3"
    fields:
      - key: "classic_cv_based"
        label: "Classic CV"
      - key: "ml_traditional"
        label: "Traditional ML"
      - key: "dl_cnn_classifier"
        label: "CNN Classifier"
      - key: "dl_cnn_detector"
        label: "CNN Detector"
      - key: "dl_rcnn_detector"
        label: "R-CNN Detector"
      - key: "dl_transformer"
        label: "Transformer"
      - key: "dl_other"
        label: "Other DL"
      - key: "hybrid"
        label: "Hybrid"

  - name: "dataset"
    friendly_name: ""
    filter_type: tri_state
    json_path: "technique.available_dataset"
    label: "Datasets"
    header_class: "inferred-header-3"


# Prompt Templates (Relative to project root)
prompts:
  classify: "prompt_templates/classify_template.txt"
  verify: "prompt_templates/verify_template.txt"
  reclassify: "prompt_templates/reclassify_template.txt"


# Basic Theme Overrides
theme:
  primary_ui_color: "hsl(188, 31%, 29%)"
  primary_ui_color_darker: "hsl(188, 34%, 27%)"
  inferred_ui_color: "hsl(154.6, 35.8%, 32.4%)"
  inferred_gradient_end_color: "rgb(57, 106, 53)"
  stats_primary_ui_color: "var(--primary-ui-color)"
  detail_button_background: "linear-gradient(180deg, hsl(210, 24%, 87%) 0%, hsl(210, 32%, 93%) 60%)"
  history_button_background: "linear-gradient(180deg, hsl(210, 24%, 87%) 0%, hsl(210, 32%, 93%) 60%)"
  min_width: "1590px"
  max_width: "2340px"
